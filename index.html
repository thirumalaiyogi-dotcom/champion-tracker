<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121a16">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Champion Mindset Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@600;800&family=Mukta+Malar:wght@400;600;700&display=swap">
<style>
/* Layout: one-column phone app; sticky day header, category groups of big tap tiles, bottom tab bar */
:root{
  --bg:#f3f5f1; --card:#ffffff; --fg:#1c2a24; --muted:#66756d; --line:#dfe5dc;
  --accent:#e2821b; --accent-ink:#ffffff; --done:#1f8a5b; --done-soft:#dcf1e5;
  --c1:#d9622b; --c2:#7a56c2; --c3:#2f7fc1; --c4:#1f8a5b; --c5:#b98a12;
  --display:"Baloo Thambi 2","Mukta Malar",system-ui,sans-serif;
  --body:"Mukta Malar","Noto Sans Tamil",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a16; --card:#1b2520; --fg:#e8efe9; --muted:#9aaba1; --line:#2b3831;
  --accent:#f0983a; --accent-ink:#1a120a; --done:#3fbf85; --done-soft:#1c3a2c;
  --c1:#f08458; --c2:#a487e6; --c3:#62a8e6; --c4:#3fbf85; --c5:#dcb43f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a16; --card:#1b2520; --fg:#e8efe9; --muted:#9aaba1; --line:#2b3831;
  --accent:#f0983a; --accent-ink:#1a120a; --done:#3fbf85; --done-soft:#1c3a2c;
  --c1:#f08458; --c2:#a487e6; --c3:#62a8e6; --c4:#3fbf85; --c5:#dcb43f; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0;letter-spacing:.2px}
.brand small{color:var(--muted);font-size:.8rem}
.daybar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px}
.navbtn{width:44px;height:44px;border-radius:12px;border:0;background:var(--bg);color:var(--fg);font-size:1.3rem;cursor:pointer}
.navbtn:disabled{opacity:.35}
.dayinfo{flex:1;min-width:0;text-align:center}
.dayinfo b{display:block;font-family:var(--display);font-size:1.1rem}
.dayinfo span{color:var(--muted);font-size:.85rem}
.ring{width:56px;height:56px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.cheer{text-align:center;font-weight:600;color:var(--accent);min-height:1.4em;font-size:.95rem}
section.cat{margin-top:18px}
.cat h2{font-family:var(--display);font-size:1.05rem;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.cat h2 .dot{width:10px;height:10px;border-radius:50%;background:var(--cc)}
.cat h2 .cnt{margin-left:auto;font-family:var(--body);font-size:.85rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;min-height:64px;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:10px 10px 10px 40px;text-align:left;font:inherit;font-weight:600;font-size:.92rem;line-height:1.25;overflow-wrap:anywhere;word-break:break-word;min-width:0;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.tile:active{transform:scale(.97)}
.tile::before{content:"";position:absolute;left:10px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:7px;border:2px solid var(--cc)}
.tile.on{background:var(--done-soft);border-color:var(--done)}
.tile.on::before{background:var(--done);border-color:var(--done)}
.tile.on::after{content:"";position:absolute;left:17px;top:50%;width:6px;height:11px;margin-top:-7px;border:solid var(--card);border-width:0 3px 3px 0;transform:rotate(45deg)}
.tile .streak{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.tile small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.tile:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;gap:8px}
.tabs button{flex:1;min-width:0;max-width:150px;font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2;border:0;border-radius:12px;padding:10px 6px;background:transparent;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.tabs button.act{background:var(--accent);color:var(--accent-ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
.panel h3{margin:0 0 10px;font-family:var(--display);font-size:1.05rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:.72rem;color:var(--muted);text-align:center;font-weight:600}
.cal button{aspect-ratio:1;max-width:100%;border:0;border-radius:10px;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--fg);background:var(--bg);font-variant-numeric:tabular-nums}
.cal button.today{outline:2px solid var(--accent);outline-offset:1px}
.cal button:disabled{opacity:.3;cursor:default}
.legend{display:flex;gap:6px;align-items:center;font-size:.75rem;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{width:16px;height:16px;border-radius:4px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.stat span{font-size:.78rem;color:var(--muted)}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) 90px 42px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.hrow:last-child{border-bottom:0}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);border-radius:4px}
.hrow em{font-style:normal;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.filebtn{display:block;text-align:center;border:2px dashed var(--accent);color:var(--fg);border-radius:12px;padding:14px;font-weight:700;cursor:pointer}
.wchart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end}
.wcol{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;font-variant-numeric:tabular-nums}
.wcol span{color:var(--muted)}
.wbar{width:100%;max-width:34px;height:110px;background:var(--bg);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wbar i{display:block;width:100%;background:var(--done);border-radius:8px 8px 0 0}
.stat b.up{color:var(--done)} .stat b.down{color:var(--c1)}
textarea{width:100%;font:inherit;font-size:.85rem;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);resize:vertical}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.mnav b{font-family:var(--display);font-size:1.15rem}
.edit-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.edit-row span{flex:1;min-width:0}
.edit-row button,.small{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:6px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.edit-row button.del{color:var(--c1)}
.edit-row{flex-wrap:wrap}
.edit-row span{flex:1 1 150px}
.edit-row .meta{display:block;color:var(--muted);font-size:.78rem}
.edit-row button.mv{width:36px;padding:6px 0}
.edit-row button:disabled{opacity:.3}
.editor{display:flex;flex-direction:column;gap:6px;margin:8px 0;padding:12px;border-radius:14px;border:2px solid var(--cc);background:var(--bg)}
.editor label{font-size:.82rem;font-weight:700;color:var(--muted);margin-top:4px}
.editor input,.editor select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);width:100%;min-width:0}
.trow{display:flex;gap:8px;align-items:center}
.trow input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:44px;padding:8px 6px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--done);border-color:var(--done);color:var(--card)}
.ebtns{display:flex;gap:8px;margin-top:8px}
.ebtns .primary{flex:1}
.addbox{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.addbox input,.addbox select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:12px;border-radius:12px;cursor:pointer}
.note{font-size:.8rem;color:var(--muted);margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;font-weight:600;font-size:.9rem;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header id="hdr">
    <div class="brand"><h1>சாம்பியன் டிராக்கர் 🏆</h1><small id="saveState">சேமிக்கப்பட்டது</small></div>
    <div class="daybar" id="daybar">
      <button class="navbtn" id="prevDay" aria-label="முந்தைய நாள்">‹</button>
      <div class="dayinfo"><b id="dayTitle">இன்று</b><span id="dayDate"></span></div>
      <div class="ring"><svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="23" fill="none" stroke="var(--line)" stroke-width="6"/><circle id="ringArc" cx="28" cy="28" r="23" fill="none" stroke="var(--done)" stroke-width="6" stroke-linecap="round" stroke-dasharray="144.5" stroke-dashoffset="144.5"/></svg><em id="ringTxt">0%</em></div>
      <button class="navbtn" id="nextDay" aria-label="அடுத்த நாள்">›</button>
    </div>
    <div class="cheer" id="cheer"></div>
  </header>

  <main id="viewToday"></main>
  <main id="viewWeek" hidden></main>
  <main id="viewMonth" hidden></main>
  <main id="viewEdit" hidden></main>
</div>

<nav class="tabs">
  <button id="tabToday" class="act"><span aria-hidden="true">✅</span>இன்று</button>
  <button id="tabWeek"><span aria-hidden="true">📊</span>வாரம்</button>
  <button id="tabMonth"><span aria-hidden="true">📅</span>மாதம்</button>
  <button id="tabEdit"><span aria-hidden="true">⚙️</span>பழக்கங்கள்</button>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
const CATS=[
 {id:"body",ta:"1. உடல்",en:"Body",c:"--c1"},
 {id:"char",ta:"2. குணம்",en:"Character",c:"--c2"},
 {id:"habit",ta:"3. பழக்கம்",en:"Habits",c:"--c3"},
 {id:"soul",ta:"4. ஆன்மா",en:"Soul",c:"--c4"},
 {id:"wealth",ta:"5. செல்வம் & இலக்கு",en:"Wealth & Goal",c:"--c5"}
];
const DEFAULT_HABITS=[
 ["body","அதிகாலை எழுதல்","Wake up 5:30 AM"],["body","உடற்பயிற்சி / பிராணாயாமம்","Exercise"],["body","சரியான உணவு","Food"],["body","தண்ணீர்","Water"],["body","சப்ளிமெண்ட்","Supplement"],["body","தூக்கம்","Sleep 10:30 PM"],
 ["char","EFT டேப்பிங்","EFT Tapping"],["char","விட்டுவிடுதல்","Let Go"],["char","மன்னிப்பு","Forgiveness"],["char","நன்றி","Gratitude"],
 ["habit","செய்ய வேண்டியவை பட்டியல்","To-Do List"],["habit","வாரியர் மைண்ட்செட்","Warrior's Mindset"],["habit","மொபைல் கட்டுப்பாடு","Mobile Screening"],["habit","குறைந்த பேச்சு, அதிக வேலை","Less Talk More Work"],["habit","SaHa","SaHa"],["habit","1234 No","1234 No"],
 ["soul","தியானம்","Meditation"],["soul","உறுதிமொழி","Affirmation"],["soul","மேனிஃபெஸ்டேஷன்","Manifestation"],["soul","விஷன் போர்டு","Vision Board"],["soul","ஜபம்","Jabam"],["soul","பூஜை","Poojai"],
 ["wealth","தர்மம் ₹10","Charity 10 Rs"],["wealth","பொறுப்பு நண்பர்","Accountability Partner"],["wealth","புத்தக வாசிப்பு","Book Reading"],["wealth","கணக்கு ஷீட்","Account Sheet"]
].map((h,i)=>({id:"h"+(i+1),cat:h[0],ta:h[1],en:h[2]}));
// keep original ids stable (h26 = 1234 No was added later)
(()=>{const i=DEFAULT_HABITS.findIndex(h=>h.ta==="1234 No");DEFAULT_HABITS.forEach((h,k)=>{h.id="h"+(k<i?k+1:k===i?26:k)})})();
DEFAULT_HABITS.find(h=>h.id==="h1").time="05:30";DEFAULT_HABITS.find(h=>h.id==="h6").time="22:30";
function migrate(){
  if((state.mig||0)>=1) return;
  if(!state.habits.some(h=>h.id==="h26")){
    let at=-1; state.habits.forEach((h,k)=>{if(h.cat==="habit")at=k});
    state.habits.splice(at+1,0,{id:"h26",cat:"habit",ta:"1234 No",en:"1234 No"});
  }
  const h1=state.habits.find(h=>h.id==="h1"); if(h1&&h1.time===undefined) h1.time="05:30";
  const h6=state.habits.find(h=>h.id==="h6"); if(h6&&h6.time===undefined) h6.time="22:30";
  state.mig=1; habitsDirty=true;
}

const TA_MONTHS=["ஜனவரி","பிப்ரவரி","மார்ச்","ஏப்ரல்","மே","ஜூன்","ஜூலை","ஆகஸ்ட்","செப்டம்பர்","அக்டோபர்","நவம்பர்","டிசம்பர்"];
const TA_DAYS=["ஞாயிறு","திங்கள்","செவ்வாய்","புதன்","வியாழன்","வெள்ளி","சனி"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const ymOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};

let state={habits:DEFAULT_HABITS,months:{}}; // months["2026-10"] = {"29":["h1","h3"]}
let cur=today(), viewMonth=new Date(cur.getFullYear(),cur.getMonth(),1), tab="today";
let db=null, uid=null;

function lsGet(){try{const s=localStorage.getItem("cmt-v1");return s?JSON.parse(s):null}catch(e){return null}}
function lsSet(){try{localStorage.setItem("cmt-v1",JSON.stringify(state))}catch(e){}}
const saved=lsGet(); if(saved&&saved.habits) state=saved;

function dayList(d){const m=state.months[ymOf(d)]||{};return m[d.getDate()]||[]}
function isOn(d,h){return dayList(d).includes(h)}

let saveTimer=null, dirtyMonths=new Set(), habitsDirty=false;
function scheduleSave(){
  lsSet(); $("saveState").textContent="சேமிக்கிறது…";
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(db&&uid){
    try{
      if(habitsDirty){await db.doc(`data/users/${uid}/habits`).set({list:state.habits,mig:state.mig||0});habitsDirty=false}
      for(const ym of [...dirtyMonths]){await db.doc(`data/users/${uid}/m${ym}`).set({days:state.months[ym]||{}});dirtyMonths.delete(ym)}
    }catch(e){$("saveState").textContent="இந்த போனில் மட்டும் சேமிக்கப்பட்டது";return}
  }
  $("saveState").textContent="சேமிக்கப்பட்டது ✓";
}

function toggle(h){
  const ym=ymOf(cur), dd=cur.getDate();
  const m=state.months[ym]=state.months[ym]||{};
  const list=m[dd]=m[dd]||[];
  const i=list.indexOf(h); if(i>=0) list.splice(i,1); else list.push(h);
  dirtyMonths.add(ym); scheduleSave(); renderToday(); renderHeader();
  if(i<0&&pctFor(cur)===100) toast("🎉 இன்றைய எல்லா பழக்கமும் முடிந்தது! சாம்பியன்!");
}

const onDay=(h,d)=>!h.days||!h.days.length||h.days.includes(d.getDay());
const sched=d=>state.habits.filter(h=>onDay(h,d));
function habitStreak(h,from){ // consecutive scheduled days ticked, ending at `from` (today not yet ticked doesn't break it)
  let n=0,d=new Date(from),first=true;
  for(let i=0;i<400;i++,d.setDate(d.getDate()-1)){
    if(!onDay(h,d)) continue;
    if(isOn(d,h.id)) n++; else if(!first) break;
    first=false;
  }
  return n;
}
function pctFor(d){const hs=sched(d),n=hs.length;if(!n)return 0;const ids=new Set(hs.map(h=>h.id));return Math.round(dayList(d).filter(x=>ids.has(x)).length/n*100)}

function renderHeader(){
  const t=today(), diff=Math.round((t-cur)/864e5);
  $("dayTitle").textContent=diff===0?"இன்று":diff===1?"நேற்று":TA_DAYS[cur.getDay()];
  $("dayDate").textContent=cur.getDate()+" "+TA_MONTHS[cur.getMonth()]+" "+cur.getFullYear();
  $("nextDay").disabled=diff<=0;
  const p=pctFor(cur); $("ringTxt").textContent=p+"%";
  $("ringArc").setAttribute("stroke-dashoffset",(144.5*(1-p/100)).toFixed(1));
  $("cheer").textContent=p===100?"🔥 முழு வெற்றி! அருமை!":p>=70?"💪 சூப்பர்! கொஞ்சம் தான் பாக்கி":p>=40?"👍 நல்ல தொடக்கம், தொடருங்கள்":p>0?"🌱 ஒவ்வொரு டிக்கும் ஒரு வெற்றி":"ஒரு பழக்கத்தைத் தொட்டு ✓ போடுங்கள்";
  $("daybar").parentElement.querySelector(".daybar").style.display=tab==="today"?"flex":"none";
  $("cheer").hidden=tab!=="today";
}

function renderToday(){
  const v=$("viewToday"); v.innerHTML="";
  for(const c of CATS){
    const hs=sched(cur).filter(h=>h.cat===c.id); if(!hs.length) continue;
    const done=hs.filter(h=>isOn(cur,h.id)).length;
    const s=document.createElement("section"); s.className="cat"; s.style.setProperty("--cc",`var(${c.c})`);

     ${rows.map(r=>`<div class="hrow"><span>${esc(r.h.ta)}</span><div class="bar"><i style="width:${r.p}%"></i></div><em>${r.p}%</em></div>`).join("")}

// ---------- Import old Excel tracker ----------
// Pure parser: sheets = [{name, rows: any[][]}] -> {ticks: {"2026-01": {"10":["h1"]}}, unmatched: Set, days, count}
const NAME_MAP=[
 [/wake ?up/i,"h1"],[/exercise|pranayam|walking|yoga|kiriya/i,"h2"],[/^food/i,"h3"],[/^water/i,"h4"],
 [/supplement/i,"h5"],[/^sleep/i,"h6"],[/eft/i,"h7"],[/let ?go/i,"h8"],[/forgiv/i,"h9"],[/gratitude/i,"h10"],
 [/to-?do/i,"h11"],[/warrior/i,"h12"],[/mobile/i,"h13"],[/less talk/i,"h14"],[/^saha$/i,"h15"],
 [/meditation/i,"h16"],[/affirmation/i,"h17"],[/manifest/i,"h18"],[/vision/i,"h19"],[/jabam|japam/i,"h20"],
 [/poo?jai|pooja/i,"h21"],[/charity/i,"h22"],[/accountab/i,"h23"],[/book/i,"h24"],[/account sheet/i,"h25"],[/1234/i,"h26"]
];
function matchHabit(name){
  const n=String(name).replace(/[\u200b\u00a0]/g," ").replace(/\s+/g," ").trim();
  for(const [re,id] of NAME_MAP) if(re.test(n)) return id;
  return null;
}
function isTrue(v){return v===true||String(v).trim().toUpperCase()==="TRUE"}
function serialToKey(s){const d=new Date(Date.UTC(1899,11,30)+Math.round(s)*864e5);return [d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate()]}
function parseTracker(sheets){
  const ticks={}, unmatched={}; let count=0; const dayset=new Set();
  for(const sh of sheets){
    const rows=sh.rows; let start=rows.findIndex(r=>r&&String(r[1]||"").trim().toUpperCase()==="DAILY HABITS");
    if(start<0) continue;
    let cols=null;
    for(let i=start+1;i<rows.length&&i<start+6;i++){
      const r=rows[i]||[]; const c={};
      for(let j=2;j<r.length;j++){const v=Number(r[j]);if(r[j]!==""&&r[j]!=null&&v>40000&&v<60000)c[j]=v}
      if(Object.keys(c).length>=20){cols=c;break}
    }
    if(!cols) continue;
    for(let i=start+1;i<rows.length;i++){
      const r=rows[i]||[]; let name="";
      for(let j=1;j<9;j++){const v=r[j];if(typeof v==="string"&&v.replace(/[\u200b\s]/g,"")&&isNaN(Number(v))){name=v;break}}
      if(!name) continue;
      let any=false; for(const j in cols) if(isTrue(r[j])){any=true;break}
      if(!any) continue;
      const clean=String(name).replace(/[\u200b\u00a0]/g," ").replace(/\s+/g," ").trim();
      const id=matchHabit(clean)||("x:"+clean.toUpperCase()); if(id.startsWith("x:")&&!unmatched[id]) unmatched[id]={name:clean,n:0};
      for(const j in cols){ if(!isTrue(r[j])) continue;
        const [y,m,d]=serialToKey(cols[j]); const ym=y+"-"+String(m).padStart(2,"0");
        const mo=ticks[ym]=ticks[ym]||{}; const l=mo[d]=mo[d]||[];
        if(!l.includes(id)){l.push(id);if(unmatched[id])unmatched[id].n++;else count++} dayset.add(ym+"-"+d);
      }
    }
  }
  return {ticks,unmatched,count,days:dayset.size};
}

async function readTrackerFile(file){
  if(/\.(txt|tsv)$/i.test(file.name)){
    const t=await file.text();
    return t.split(/^## Sheet: /m).slice(1).map(b=>{const [n,...ls]=b.split("\n");return {name:n.trim(),rows:ls.map(l=>l.split("\t"))}});
  }
  await loadXLSX();
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
  return wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""})}));
}

const mondayOf=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
let weekStart=mondayOf(today());
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
function weekStats(start){
  const t=today(), days=[];
  for(let i=0;i<7;i++){const d=addDays(start,i); if(d<=t) days.push(d)}
  let done=0,tot=0; const per=state.habits.map(h=>{let n=0,k=0;for(const d of days){if(onDay(h,d)){k++;if(isOn(d,h.id))n++}}done+=n;tot+=k;return {h,n,k}});
  return {days,per,pct:tot?Math.round(done/tot*100):0,daily:days.map(d=>({d,p:pctFor(d)}))};
}
const shortDate=d=>d.getDate()+" "+TA_MONTHS[d.getMonth()].slice(0,3);
function renderWeek(){
  const v=$("viewWeek"), t=today(), end=addDays(weekStart,6);
  const w=weekStats(weekStart), prev=weekStats(addDays(weekStart,-7));
  const diff=w.pct-prev.pct, active=w.per.filter(x=>x.k>0);
  const best=active.filter(x=>x.n>0).sort((a,b)=>b.n/b.k-a.n/a.k||b.n-a.n).slice(0,3);
  const weak=active.slice().sort((a,b)=>a.n/a.k-b.n/b.k||b.k-a.k).filter(x=>x.n<x.k).slice(0,3);
  const range=shortDate(weekStart)+" – "+shortDate(end)+" "+end.getFullYear();

    `மொத்தம்: ${w.pct}%`+(prev.days.length?` (போன வாரம் ${prev.pct}% ${diff>0?"▲":diff<0?"▼":"="}${Math.abs(diff)})`:""),
    best.length?`🔥 சிறந்தவை: ${best.map(line).join(", ")}`:"",

    <div class="trow"><input id="edTime" type="time" value="${h.time||""}"><button class="small" id="edNoTime" type="button">நேரம் வேண்டாம்</button></div>
    <label>எந்த நாட்களில்?</label>
    <div class="chips" id="edDays">${[1,2,3,4,5,6,0].map(d=>`<button type="button" class="chip ${days.includes(d)?"on":""}" data-d="${d}" aria-pressed="${days.includes(d)}">${TA_DAYS[d].slice(0,2)}</button>`).join("")}</div>
    <div class="chips"><button type="button" class="small" id="edAll">தினமும்</button><button type="button" class="small" id="edWk">வார நாட்கள்</button><button type="button" class="small" id="edWe">சனி, ஞாயிறு</button></div>
    <div class="ebtns"><button class="primary" id="edSave">${editing==="new"?"+ சேர்":"சேமி ✓"}</button><button class="small" id="edCancel">ரத்து</button></div>
  </div>`;
}

function renderEdit(){
  const v=$("viewEdit");
  const row=(h,i,arr)=>editing===h.id?editorHTML(h):`<div class="edit-row">
      <span><b>${esc(h.ta)}</b><small class="meta">${daysLabel(h)}${h.time?" · ⏰ "+fmtTime(h.time):""}</small></span>
      <button class="mv" data-id="${h.id}" data-dir="-1" ${i===0?"disabled":""} aria-label="மேலே">↑</button>
      <button class="mv" data-id="${h.id}" data-dir="1" ${i===arr.length-1?"disabled":""} aria-label="கீழே">↓</button>
      <button class="set" data-id="${h.id}">⚙️ அமை</button>
      <button class="del" data-id="${h.id}">${confirmDel===h.id?"உறுதியா?":"நீக்கு"}</button></div>`;
  v.innerHTML=`<div class="panel"><h3>என் பழக்கங்கள்</h3>
   <p class="note" style="margin-top:0">⚙️ அமை தொட்டு பெயர், பிரிவு, நேரம், நாட்கள் மாற்றலாம். ↑ ↓ வைத்து வரிசை மாற்றலாம்.</p>
   ${CATS.map(c=>{
    const hs=state.habits.filter(h=>h.cat===c.id); if(!hs.length) return "";
    return `<div style="font-weight:700;color:var(${c.c});margin-top:12px">${c.ta}</div>`+hs.map(row).join("")}).join("")}
   <div style="margin-top:14px">${editing==="new"?editorHTML({cat:"body",ta:"",en:"",time:"",days:[]}):`<button class="primary" id="addBtn" style="width:100%">+ புதிய பழக்கம் சேர்</button>`}</div>
   <p class="note">உங்கள் டிக்குகள் இந்த போனில் மட்டும் சேமிக்கப்படும். பிரவுசர் டேட்டாவை அழித்தால் இவையும் அழியும்.</p></div>`+importPanelHTML();
  wireImport();

  v.querySelectorAll(".del").forEach(b=>b.onclick=()=>{
    if(confirmDel!==b.dataset.id){confirmDel=b.dataset.id;renderEdit();return}
    state.habits=state.habits.filter(h=>h.id!==b.dataset.id);saveHabits("நீக்கப்பட்டது");
  });
  v.querySelectorAll(".set").forEach(b=>b.onclick=()=>{editing=b.dataset.id;confirmDel=null;renderEdit();$("edTa").focus()});
  v.querySelectorAll(".mv").forEach(b=>b.onclick=()=>{
    const h=state.habits.find(x=>x.id===b.dataset.id), same=state.habits.filter(x=>x.cat===h.cat);
    const j=same.indexOf(h)+(+b.dataset.dir), other=same[j]; if(!other) return;
    const a=state.habits.indexOf(h), o=state.habits.indexOf(other);
    [state.habits[a],state.habits[o]]=[state.habits[o],state.habits[a]]; saveHabits();
  });
  const add=$("addBtn"); if(add) add.onclick=()=>{editing="new";confirmDel=null;renderEdit();$("edTa").focus()};

  if(!$("edSave")) return;
  const chips=[...v.querySelectorAll("#edDays .chip")];
  const setDays=list=>chips.forEach(c=>{const on=list.includes(+c.dataset.d);c.classList.toggle("on",on);c.setAttribute("aria-pressed",on)});
  chips.forEach(c=>c.onclick=()=>{const on=!c.classList.contains("on");c.classList.toggle("on",on);c.setAttribute("aria-pressed",on)});
  $("edAll").onclick=()=>setDays([0,1,2,3,4,5,6]);
  $("edWk").onclick=()=>setDays([1,2,3,4,5]);
  $("edWe").onclick=()=>setDays([0,6]);
  $("edNoTime").onclick=()=>{$("edTime").value=""};
  $("edCancel").onclick=()=>{editing=null;renderEdit()};
  $("edSave").onclick=()=>{
    const ta=$("edTa").value.trim(); if(!ta){toast("பழக்கத்தின் பெயரை எழுதுங்கள்");return}
    const days=chips.filter(c=>c.classList.contains("on")).map(c=>+c.dataset.d);
    if(!days.length){toast("குறைந்தது ஒரு நாளைத் தேர்வு செய்யுங்கள்");return}
    const data={ta,en:$("edEn").value.trim(),cat:$("edCat").value,time:$("edTime").value||"",days:days.length===7?[]:days};
    if(editing==="new"){state.habits.push({id:"u"+Date.now().toString(36),...data});saveHabits("சேர்க்கப்பட்டது ✓")}
    else{Object.assign(state.habits.find(h=>h.id===editing),data);saveHabits("சேமிக்கப்பட்டது ✓")}
  };
}

function setTab(t){
  tab=t; ["today","week","month","edit"].forEach(x=>{
    $("view"+x[0].toUpperCase()+x.slice(1)).hidden=x!==t;
    $("tab"+x[0].toUpperCase()+x.slice(1)).classList.toggle("act",x===t)});
  if(t==="today")renderToday(); if(t==="month")renderMonth(); if(t==="week")renderWeek(); if(t==="edit"){confirmDel=null;renderEdit()}
  renderHeader(); scrollTo({top:0});
}
$("tabToday").onclick=()=>setTab("today");
$("tabMonth").onclick=()=>{viewMonth=new Date(cur.getFullYear(),cur.getMonth(),1);setTab("month")};
$("tabEdit").onclick=()=>setTab("edit");
$("tabWeek").onclick=()=>{weekStart=mondayOf(today());setTab("week")};
$("prevDay").onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()-1);renderToday();renderHeader()};
$("nextDay").onclick=()=>{if(cur<today()){cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+1);renderToday();renderHeader()}};

let toastT; function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

migrate();
setTab("today");

// Cloud sync (private per person). Works offline with phone storage if unavailable.
(async()=>{
  try{
    if(!window.claude||!claude.use) return;
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u) return; const id=await u.id(); if(!id) return;
    db=d; uid=id;
    const hs=await db.doc(`data/users/${uid}/habits`).get();
    if(hs.exists&&Array.isArray(hs.data().list)){state.habits=hs.data().list;state.mig=hs.data().mig||0} else habitsDirty=true;
    migrate();
    const t=today();
    for(let i=0;i<12;i++){
      const dt=new Date(t.getFullYear(),t.getMonth()-i,1), ym=ymOf(dt);
      const s=await db.doc(`data/users/${uid}/m${ym}`).get();
      if(s.exists&&s.data().days){
        const local=state.months[ym]||{}, remote=s.data().days, merged={...remote};
        for(const k in local){ if(!merged[k]) merged[k]=local[k]; else merged[k]=[...new Set([...merged[k],...local[k]])] }
        state.months[ym]=merged;
        if(JSON.stringify(merged)!==JSON.stringify(remote)) dirtyMonths.add(ym);
      } else if(state.months[ym]) dirtyMonths.add(ym);
    }
    lsSet(); setTab(tab); if(dirtyMonths.size||habitsDirty) flush();
  }catch(e){}
})();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
